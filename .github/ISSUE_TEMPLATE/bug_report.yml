name: Bug report
description: Report a problem in Dexter's Laboratory V1
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials or private research. See SECURITY.md for sensitive reports."
  - type: input
    id: version
    attributes:
      label: Version and operating system
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Review screenshots and logs before sharing.
